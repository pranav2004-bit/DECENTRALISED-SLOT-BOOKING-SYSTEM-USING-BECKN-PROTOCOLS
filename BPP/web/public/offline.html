<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Provider App</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    margin: 0;
    background: #ffffff;
    color: #171717;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 360px; }
  h1 { font-size: 1.25rem; margin-bottom: 8px; }
  p { color: #525252; font-size: 0.9rem; }
  button {
    margin-top: 16px;
    background: #d97706;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 0.9rem;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Managing orders and availability needs a real connection to stay accurate. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
