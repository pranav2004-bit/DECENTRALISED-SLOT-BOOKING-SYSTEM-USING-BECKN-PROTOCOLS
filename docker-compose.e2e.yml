# E2E-only compose overlay (livetracker3.md §5.2) — applied ON TOP of docker-compose.yml
# ONLY for the automated Playwright golden-path suite (`docker compose -f docker-compose.yml
# -f docker-compose.e2e.yml up -d`), never for normal local dev. Two, and only two, real
# reasons this overlay exists instead of folding either change into docker-compose.yml or
# each app's own .env directly:
#
# 1. `RECONCILIATION_INTERVAL_SECONDS` override (bpp-backend only). The golden path's booking
#    only ever reaches Booking.Status.COMPLETE via the real, unmodified periodic sweep
#    (`sweep_completed_bookings()`, BPP/backend/core/reconciliation.py) — there is no fixture
#    or management-command shortcut for this by design (see that file's own docstring). The
#    real default (60s, BPP/backend/.env's own committed value) would work fine correctness-
#    wise but adds up to a full extra minute of pure idle CI time on top of the already-real
#    ~9-minute wait for the slot's own fulfillment window to end (see golden-path.spec.ts's
#    own comments for that wait's derivation) — shortened here to 15s for this job only. The
#    default in BPP/backend/.env / .env.example is deliberately left untouched (60s remains
#    correct for real dev/production use) — this override applies ONLY when this file is
#    explicitly layered on top via -f, never implicitly.
#
# 2. Local participant identity (`SUBSCRIBER_ID`/`SUBSCRIBER_URL`) for bap-backend, bpp-backend,
#    beckn-gateway. docker-compose.override.yml (gitignored, per its own header comment) is
#    what supplies these on a developer's machine — CI has no such file, so onboarding would
#    fail with "SUBSCRIBER_URL is not configured" (onboarding_service.py's own real check)
#    without a committed equivalent. Values mirror docker-compose.override.yml's own
#    convention exactly (real Docker service DNS names) — this is not new configuration, just
#    the already-established local-identity pattern made available to a CI runner that can't
#    read a gitignored file.
#
# 3. Isolated, disposable Postgres for CI only (added 2026-09-02, when local dev moved to Neon
#    — see RUNBOOK.md's "Postgres moved to Neon" note). CI must never point at the same Neon
#    databases local dev/production use: shared state between CI runs and real data, real
#    credentials sitting in CI env/logs, and ongoing Neon cost per run — all real problems a
#    disposable local container avoids for exactly the isolated/repeatable use case CI needs.
#    Only the 3 DBs this job's own service list actually needs (registry, bap, bpp — matches
#    the "Build the real docker-compose stack" step below; bpp-medical/automotive/bap-y and
#    their DBs are never built here, so no DB for them either).
services:
  registry-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry # pragma: allowlist secret — CI-only, disposable
      POSTGRES_DB: registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry"]
      interval: 10s
      timeout: 5s
      retries: 5

  bap-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bap
      POSTGRES_PASSWORD: bap # pragma: allowlist secret — CI-only, disposable
      POSTGRES_DB: bap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bap"]
      interval: 10s
      timeout: 5s
      retries: 5

  bpp-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bpp
      POSTGRES_PASSWORD: bpp # pragma: allowlist secret — CI-only, disposable
      POSTGRES_DB: bpp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpp"]
      interval: 10s
      timeout: 5s
      retries: 5

  registry:
    depends_on:
      registry-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://registry:registry@registry-db:5432/registry # pragma: allowlist secret

  bap-backend:
    depends_on:
      bap-db:
        condition: service_healthy
    environment:
      SUBSCRIBER_ID: bap-backend.local
      SUBSCRIBER_URL: http://bap-backend:8000
      DATABASE_URL: postgres://bap:bap@bap-db:5432/bap # pragma: allowlist secret

  bpp-backend:
    depends_on:
      bpp-db:
        condition: service_healthy
    environment:
      RECONCILIATION_INTERVAL_SECONDS: "15"
      SUBSCRIBER_ID: bpp-backend.local
      SUBSCRIBER_URL: http://bpp-backend:8000
      DATABASE_URL: postgres://bpp:bpp@bpp-db:5432/bpp # pragma: allowlist secret

  bpp-worker:
    depends_on:
      bpp-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bpp:bpp@bpp-db:5432/bpp # pragma: allowlist secret

  beckn-gateway:
    environment:
      SUBSCRIBER_ID: beckn-gateway.local
      SUBSCRIBER_URL: http://beckn-gateway:8000
