# Client-presentation deployment override (livetracker5.md's deployment plan, Stage 1).
# Adds Caddy for real HTTPS on top of the existing docker-compose.yml services — nothing
# in the base file is changed, this only adds one new service. Run alongside the base
# file, naming only the backend services actually needed for the demo (registry,
# beckn-gateway, bap-backend, bpp-backend x3 + their workers, caddy) — bap-y-backend/web,
# prometheus/grafana, and key-rotation-scheduler are deliberately left out by omission,
# not by profile (Compose only starts services you name plus their depends_on chain):
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d \
#     registry beckn-gateway bap-backend bpp-backend bpp-worker \
#     bpp-medical-backend bpp-medical-worker bpp-automotive-backend bpp-automotive-worker \
#     caddy
#
# PUBLIC_HOSTNAME must be set in the shell environment before this runs — see
# deploy/caddy/Caddyfile's own header comment.

services:
  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME to the EC2 instance's public DNS hostname}
    ports:
      - "9000:9000"
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
      - "9004:9004"
      - "9005:9005"
      - "80:80" # Let's Encrypt HTTP-01 challenge — Caddy needs this even though app traffic is on 9000-9005
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # persists the issued cert/key across container restarts
      - caddy-config:/config
    # Real gap found live during Stage 2 onboarding: Registry (running on this same
    # EC2 host) calls each participant's own public SUBSCRIBER_URL for the real
    # on_subscribe verification challenge — a call from inside this host, out through
    # its own public IP, and back in (hairpin NAT), which AWS's VPC networking does
    # not reliably support and which hung until the caller's own client timeout
    # fired. This alias makes Docker's internal DNS resolve PUBLIC_HOSTNAME straight
    # to this container for every other service on this same compose network — the
    # TLS handshake still succeeds (Caddy's cert is genuinely for that hostname), the
    # hairpin round-trip through AWS's public network is just skipped entirely. Real
    # external callers (a browser, Razorpay's webhook) are unaffected — they only
    # ever resolve PUBLIC_HOSTNAME via real public DNS (nip.io), never this alias.
    networks:
      default:
        aliases:
          - "${PUBLIC_HOSTNAME}"
    depends_on:
      - registry
      - bap-backend
      - bpp-backend
      - beckn-gateway
      - bpp-medical-backend
      - bpp-automotive-backend

volumes:
  caddy-data:
  caddy-config:
