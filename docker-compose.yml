# Local/dev full-stack orchestration — 4 apps + Redis. Postgres moved to Neon (managed,
# cloud-hosted) 2026-09-02 — see CLOUD_KEY_PERSISTENCE.md's sibling reasoning; each
# service's own .env DATABASE_URL now points at its Neon connection string instead of
# a local container. This removes 6 containers from the local stack (registry-db,
# bap-db, bpp-db, bpp-medical-db, bpp-automotive-db, bap-y-db) — real relief for the
# CPU/RAM contention root-caused earlier (2026-08-30/09-01) on a resource-constrained
# host, confirmed live.
# See README.md for setup steps and ARCHITECTURE.md for the system overview.
# STATUS: scaffolded ahead of Phase 1 application code — see README.md "Status note".
# services will not report healthy until Phase 1 lands each app's /health endpoint.

services:
  # --- Cache ---
  # livetracker7.md §2.2: shared by every BAP-family instance (bap-backend/BAP-X today,
  # bap-y-backend/BAP-Y added below), each on its own Redis DB index — a demo-scale
  # decision (not 5 separate Redis containers, one per new instance); revisit before any
  # real multi-operator production deployment.
  bap-cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # livetracker7.md §2.2: shared by every BPP-family instance (bpp-backend/BPP-Beauty,
  # bpp-medical-backend, bpp-automotive-backend below), each on its own Redis DB index —
  # same demo-scale decision as bap-cache above.
  bpp-cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # livetracker8.md §1.1: Registry's own rate limiter moved off in-memory (LocMemCache)
  # to Redis-backed, so the Subscribe/Lookup limits are enforced correctly across
  # gunicorn's 2 worker processes instead of each worker keeping its own separate counter.
  registry-cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-cache:
    image: redis:7-alpine
    restart: unless-stopped
    # livetracker2.md §3.11: promoted from the optional with-gateway-cache profile to an
    # always-on service — no longer gated behind CACHE_ENABLED's old opt-in default. `search`
    # (§3.1) now puts Gateway on continuous, customer-facing traffic just like BAP/BPP, so its
    # circuit breaker (livetracker1.md Phase 4.2's RedisCircuitBreaker) needs to be on by
    # default too, matching BAP's/BPP's own unconditional Redis dependency instead of leaving
    # Gateway as the one inconsistent app. Backs the shared circuit-breaker state fix — without
    # it, Gateway's breaker falls back to in-memory, per-worker state and won't fail fast across
    # gunicorn's workers during a Registry outage (confirmed live in Phase 4.2 and re-confirmed
    # in §3.11 with the new default).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Applications ---
  # registry, beckn-gateway, bap-backend, bpp-backend build from the repo root (context: .)
  # because each imports the shared/ monorepo folder (django_observability, contract_schemas)
  # as a sibling of its own project dir — see each Dockerfile's top comment for why.
  registry:
    build:
      context: .
      dockerfile: registry/Dockerfile
    env_file: ./registry/.env
    restart: unless-stopped
    # Real gap found and fixed at Phase 3 Exit (livetracker2.md, 2026-07-24): this
    # path was never a persisted volume, so every container recreate silently wiped
    # Registry's own signing/encryption identity, and every dependent participant's
    # trust relationship with it — the exact "Using ephemeral Registry ... key pair"
    # warning seen repeatedly in this session's own live testing.
    volumes:
      - registry-secrets:/run/secrets
    depends_on:
      registry-cache:
        condition: service_healthy
    ports:
      - "8000:8000"
    # livetracker8.md §1.2: the actual scheduled trigger for `rotate_registry_keys` — read
    # by the `key-rotation-scheduler` (ofelia) service below. The command itself only rotates a
    # key once it's actually due (settings.REGISTRY_KEY_ROTATION_DAYS), so invoking it daily
    # here is safe/idempotent, not "rotates every day."
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.rotate-registry-keys.schedule: "@daily"
      ofelia.job-exec.rotate-registry-keys.command: "python manage.py rotate_registry_keys"

  # livetracker8.md §1.2/§2.2: the real, always-running scheduler that closes "doesn't
  # depend on a human remembering to do it" — a lightweight (~15MB), Docker-native cron
  # sidecar (ofelia) that reads `ofelia.*` labels from EVERY container on the Docker
  # socket, not just one — a single instance schedules both `registry`'s and
  # `beckn-gateway`'s own key rotation (renamed from `registry-scheduler` once Gateway
  # needed the identical mechanism, §2.2's own "shared tooling" ask). Deliberately not a
  # whole new worker service/microservice for this — the actual job (check + maybe
  # rotate) runs a few times a year at most; a full service would be over-engineering for
  # that. Cloud-provider-agnostic: this is the same mechanism whether the eventual
  # production host is a single VM or anything else running this same Compose file — it's
  # not tied to any specific cloud choice, so it doesn't need to wait on §1.6.
  key-rotation-scheduler:
    image: mcuadros/ofelia:latest
    depends_on:
      registry:
        condition: service_healthy
      beckn-gateway:
        condition: service_healthy
      bpp-backend:
        condition: service_healthy
      bpp-medical-backend:
        condition: service_healthy
      bpp-automotive-backend:
        condition: service_healthy
      bap-backend:
        condition: service_healthy
      bap-y-backend:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker

  beckn-gateway:
    build:
      context: .
      dockerfile: beckn-gateway/Dockerfile
    env_file: ./beckn-gateway/.env
    restart: unless-stopped
    # Same fix as registry above — Gateway's key wipe on recreate is the exact,
    # repeatedly-hit "re-run onboarding for all three" recovery procedure documented
    # in RUNBOOK.md; this volume is what actually closes that gap going forward.
    # Real, separate gap found and fixed 2026-09-30: ONBOARDING_STATE_PATH
    # (/app/data/onboarding_state.json — Gateway's own record of which domains it's
    # SUBSCRIBED for, since it has no database) sat OUTSIDE this mount and was never
    # itself persisted — confirmed live: a container recreate wiped it clean while
    # Registry's own DB still correctly showed both domains SUBSCRIBED, leaving
    # Gateway's local state silently out of sync with reality. Found while testing the
    # domain-agnostic rotation fix above, which reads its domain list from exactly this
    # file. `gateway-state:/app/data` mounted here (layered under the more specific
    # `/app/data/secrets` mount, which still applies within it) closes this the same
    # way the secrets volume already closes the key-wipe gap.
    volumes:
      - gateway-state:/app/data
      - gateway-secrets:/app/data/secrets
    depends_on:
      registry:
        condition: service_started
      gateway-cache:
        condition: service_healthy
    ports:
      - "8003:8000"
    # livetracker8.md §2.2: same shared scheduler that already watches `registry` above —
    # ofelia's daemon reads `ofelia.*` labels from every container on the Docker socket,
    # not just one, so no second scheduler instance is needed for Gateway's own rotation.
    # Real bug found and fixed 2026-09-30: this label used to hardcode a single domain
    # (`ONDC:RET13`) — once Gateway also became SUBSCRIBED for `ONDC:SRV13`, that would
    # have rotated Gateway's one shared signing key and only told Registry about the
    # RET13 half, silently breaking SRV13 traffic the next time it was checked. The
    # command is now domain-agnostic (reads every currently-SUBSCRIBED domain from
    # Gateway's own local onboarding state itself) — no domain argument here anymore,
    # and none needs adding when a future domain is onboarded either.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.rotate-gateway-keys.schedule: "@daily"
      ofelia.job-exec.rotate-gateway-keys.command: "python manage.py onboarding_rotate_keys"
      # 2026-10-21: catches identity drift (on-disk key vs Registry's record)
      # within a day instead of silently breaking search — see
      # check_identity_consistency's own docstring for the real incident this closes.
      ofelia.job-exec.check-gateway-identity.schedule: "@daily"
      ofelia.job-exec.check-gateway-identity.command: "python manage.py check_identity_consistency"

  bap-backend:
    build:
      context: .
      dockerfile: BAP/backend/Dockerfile
    env_file: ./BAP/backend/.env
    # Same fix as registry/beckn-gateway above.
    volumes:
      - bap-secrets:/app/data/secrets
    depends_on:
      bap-cache:
        condition: service_healthy
      registry:
        condition: service_started
    ports:
      - "8001:8000"
    # Same shared key-rotation-scheduler mechanism as registry/beckn-gateway/bpp-backend
    # above — BAP's own onboarding_rotate_keys is now live-verified end-to-end (2026-09-06).
    # Made domain-agnostic 2026-09-30 (same fix as beckn-gateway's identical command) —
    # no domain argument anymore, reads every currently-SUBSCRIBED domain from BAP's own
    # OnboardingStatus table instead of this hardcoded single value.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.rotate-bap-keys.schedule: "@daily"
      ofelia.job-exec.rotate-bap-keys.command: "python manage.py onboarding_rotate_keys"
      # 2026-10-21: catches identity drift (on-disk key vs Registry's record)
      # within a day instead of silently breaking search — see
      # check_identity_consistency's own docstring for the real incident this closes.
      ofelia.job-exec.check-bap-identity.schedule: "@daily"
      ofelia.job-exec.check-bap-identity.command: "python manage.py check_identity_consistency"

  bap-web:
    build:
      context: ./BAP/web
      args:
        # Server-side only (next.config.ts's rewrite destination, and any RSC
        # fetch) — this process runs *inside* this container, so it must reach
        # bap-backend via the Compose network's own service DNS, not
        # "localhost" (which inside this container is this container itself,
        # not the host). The browser never reads this value for routing — see
        # api-client.ts's own `typeof window === 'undefined'` branch — it
        # always calls this app's same-origin /api/:path*, which is what that
        # rewrite then proxies to the address below.
        NEXT_PUBLIC_API_BASE_URL: http://bap-backend:8000
        # Browser-only (new WebSocket(...) only ever runs client-side) — the
        # opposite constraint from the URL above: this one genuinely must
        # resolve from the *user's own machine*, so it stays the host-mapped
        # address, not the container-internal one.
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8001
        NEXT_PUBLIC_BRAND_ID: x
        # Razorpay's key_id is a public identifier, not a secret — same real
        # value as BAP/backend/.env's own RAZORPAY_KEY_ID (duplicated here
        # deliberately, like HOLD_SECONDS elsewhere in this codebase, since
        # compose build args can't read another service's env_file; keep
        # both in sync on a real key rotation).
        NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_TwQxlTIPuAS4ar
    env_file: ./BAP/web/.env
    depends_on:
      - bap-backend
    ports:
      - "3006:3000"

  bpp-backend:
    build:
      context: .
      dockerfile: BPP/backend/Dockerfile
    env_file: ./BPP/backend/.env
    restart: unless-stopped
    # Same fix as registry/beckn-gateway/bap-backend above.
    volumes:
      - bpp-secrets:/app/data/secrets
    depends_on:
      bpp-cache:
        condition: service_healthy
      registry:
        condition: service_started
    ports:
      - "8002:8000"
    # ofelia's daemon (the key-rotation-scheduler sidecar) reads these labels off this
    # container directly, same mechanism already used for registry/beckn-gateway above
    # — BPP's own onboarding_rotate_keys command is now live-verified end-to-end
    # (2026-09-06) and follows the identical generate-in-memory/submit-before-persist
    # design as Gateway's, so it's safe to put on the same automated cadence.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.rotate-bpp-keys.schedule: "@daily"
      ofelia.job-exec.rotate-bpp-keys.command: "python manage.py onboarding_rotate_keys ONDC:RET13"
      # 2026-10-21: catches identity drift (on-disk key vs Registry's record)
      # within a day instead of silently breaking search — see
      # check_identity_consistency's own docstring for the real incident this closes.
      ofelia.job-exec.check-bpp-identity.schedule: "@daily"
      ofelia.job-exec.check-bpp-identity.command: "python manage.py check_identity_consistency"

  # livetracker4.md §2.1 cutover (2026-08-02): BPP's audit-log/metrics/WebSocket-
  # broadcast consumers no longer run inline inside bpp-backend's own request path —
  # `run_event_worker` (a real, separate long-lived process, not a request-handling
  # server) is now the only thing that drives them, so it must run continuously
  # alongside bpp-backend, not just be invoked ad hoc. Same image/env/DB as
  # bpp-backend (shares the same Django app and settings), different command.
  bpp-worker:
    build:
      context: .
      dockerfile: BPP/backend/Dockerfile
    env_file: ./BPP/backend/.env
    command: ["python", "manage.py", "run_event_worker"]
    # Real identity-drift incident found live (2026-10-26): this service had no
    # secrets volume at all, so its own on-disk signing key lived only in the
    # container's ephemeral filesystem — recreating this container (a plain image
    # update, not even a key rotation) silently generated a brand-new key that no
    # longer matched Registry's stored record for this same subscriber_id, which
    # bpp-backend's own persistent-volume-backed key still correctly held. Mounted
    # read-only: this process has no business generating or rotating keys itself —
    # only bpp-backend's own entrypoint/rotation cron should ever write here; this
    # mount exists so the worker reads that same already-correct key, never its own.
    volumes:
      - bpp-secrets:/app/data/secrets:ro
    # This process never serves HTTP — bpp-backend's inherited Dockerfile HEALTHCHECK
    # (a GET against :8000/health) would otherwise report it permanently unhealthy.
    healthcheck:
      disable: true
    # No other service in this file sets a restart policy — that's a pre-existing,
    # separate gap out of this section's own scope. This one matters more here
    # specifically: audit logging, business metrics, and WebSocket broadcasts now
    # depend entirely on this one process staying alive (livetracker4.md §2.1's
    # own gap audit), with nothing else covering for it if it dies. `unless-
    # stopped` restarts on crash/host-reboot but not after a deliberate `docker
    # compose stop`.
    restart: unless-stopped
    depends_on:
      bpp-cache:
        condition: service_healthy

  bpp-web:
    build:
      context: ./BPP/web
      args:
        # Same container-vs-host networking fix as bap-web above — this is the
        # server-side rewrite destination (runs inside this container), not a
        # value the browser ever routes through.
        NEXT_PUBLIC_API_BASE_URL: http://bpp-backend:8000
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8002
        NEXT_PUBLIC_BRAND_ID: beauty
    env_file: ./BPP/web/.env
    depends_on:
      - bpp-backend
    ports:
      - "3007:3000"

  # --- livetracker7.md Phase 2: the 3 genuinely new participants ---
  # Every service below builds from the exact same Dockerfile/codebase as
  # bpp-backend/bpp-web or bap-backend/bap-web above — no forked code, per this
  # tracker's own explicit "no new forked codebases" rule. Each is differentiated
  # only by its own env_file (BPP/backend/.env.medical, .env.automotive,
  # BAP/backend/.env.y) and build args (its own backend port).

  bpp-medical-backend:
    build:
      context: .
      dockerfile: BPP/backend/Dockerfile
    env_file: ./BPP/backend/.env.medical
    restart: unless-stopped
    volumes:
      - bpp-medical-secrets:/app/data/secrets
    depends_on:
      bpp-cache:
        condition: service_healthy
      registry:
        condition: service_started
    ports:
      - "8004:8000"
    # Same shared key-rotation-scheduler mechanism as bpp-backend above — same codebase
    # (BPP/backend/Dockerfile), own domain (SUPPORTED_DOMAINS=ONDC:SRV13 in .env.medical).
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.rotate-bpp-medical-keys.schedule: "@daily"
      ofelia.job-exec.rotate-bpp-medical-keys.command: "python manage.py onboarding_rotate_keys ONDC:SRV13"
      # 2026-10-21: catches identity drift (on-disk key vs Registry's record)
      # within a day instead of silently breaking search — see
      # check_identity_consistency's own docstring for the real incident this closes.
      ofelia.job-exec.check-bpp-medical-identity.schedule: "@daily"
      ofelia.job-exec.check-bpp-medical-identity.command: "python manage.py check_identity_consistency"

  bpp-medical-worker:
    build:
      context: .
      dockerfile: BPP/backend/Dockerfile
    env_file: ./BPP/backend/.env.medical
    command: ["python", "manage.py", "run_event_worker"]
    # Same real identity-drift fix as bpp-worker above — see that service's own
    # comment for the full incident this closes.
    volumes:
      - bpp-medical-secrets:/app/data/secrets:ro
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      bpp-cache:
        condition: service_healthy

  bpp-medical-web:
    build:
      context: ./BPP/web
      args:
        # Same container-vs-host networking fix as bap-web above.
        NEXT_PUBLIC_API_BASE_URL: http://bpp-medical-backend:8000
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8004
        NEXT_PUBLIC_BRAND_ID: medical
    env_file: ./BPP/web/.env
    depends_on:
      - bpp-medical-backend
    ports:
      - "3003:3000"

  bpp-automotive-backend:
    build:
      context: .
      dockerfile: BPP/backend/Dockerfile
    env_file: ./BPP/backend/.env.automotive
    restart: unless-stopped
    volumes:
      - bpp-automotive-secrets:/app/data/secrets
    depends_on:
      bpp-cache:
        condition: service_healthy
      registry:
        condition: service_started
    ports:
      - "8005:8000"
    # Same shared key-rotation-scheduler mechanism as bpp-backend above — same codebase
    # (BPP/backend/Dockerfile), own domain (SUPPORTED_DOMAINS=BECKN:AUTO01 in .env.automotive).
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.rotate-bpp-automotive-keys.schedule: "@daily"
      ofelia.job-exec.rotate-bpp-automotive-keys.command: "python manage.py onboarding_rotate_keys BECKN:AUTO01"
      # 2026-10-21: catches identity drift (on-disk key vs Registry's record)
      # within a day instead of silently breaking search — see
      # check_identity_consistency's own docstring for the real incident this closes.
      ofelia.job-exec.check-bpp-automotive-identity.schedule: "@daily"
      ofelia.job-exec.check-bpp-automotive-identity.command: "python manage.py check_identity_consistency"

  bpp-automotive-worker:
    build:
      context: .
      dockerfile: BPP/backend/Dockerfile
    env_file: ./BPP/backend/.env.automotive
    command: ["python", "manage.py", "run_event_worker"]
    # Same real identity-drift fix as bpp-worker above — see that service's own
    # comment for the full incident this closes.
    volumes:
      - bpp-automotive-secrets:/app/data/secrets:ro
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      bpp-cache:
        condition: service_healthy

  bpp-automotive-web:
    build:
      context: ./BPP/web
      args:
        # Same container-vs-host networking fix as bap-web above.
        NEXT_PUBLIC_API_BASE_URL: http://bpp-automotive-backend:8000
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8005
        NEXT_PUBLIC_BRAND_ID: automotive
    env_file: ./BPP/web/.env
    depends_on:
      - bpp-automotive-backend
    ports:
      - "3009:3000"

  bap-y-backend:
    build:
      context: .
      dockerfile: BAP/backend/Dockerfile
    env_file: ./BAP/backend/.env.y
    restart: unless-stopped
    volumes:
      - bap-y-secrets:/app/data/secrets
    depends_on:
      bap-cache:
        condition: service_healthy
      registry:
        condition: service_started
    ports:
      - "8006:8000"
    # Same shared codebase/fix as bap-backend above (BAP/backend/Dockerfile) — not yet
    # onboarded in this environment (zero OnboardingStatus rows, confirmed 2026-09-06),
    # so this job will fail safely (logged as a failed ofelia run, not a crash) until
    # that's done — same situation as BPP's medical/automotive instances. Made
    # domain-agnostic 2026-09-30, same as bap-backend above — with zero SUBSCRIBED rows
    # today it now fails with a clearer "no SUBSCRIBED domains" error, same safe outcome.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.rotate-bap-y-keys.schedule: "@daily"
      ofelia.job-exec.rotate-bap-y-keys.command: "python manage.py onboarding_rotate_keys"
      # 2026-10-21: catches identity drift (on-disk key vs Registry's record)
      # within a day instead of silently breaking search — see
      # check_identity_consistency's own docstring for the real incident this closes.
      ofelia.job-exec.check-bap-y-identity.schedule: "@daily"
      ofelia.job-exec.check-bap-y-identity.command: "python manage.py check_identity_consistency"

  bap-y-web:
    build:
      context: ./BAP/web
      args:
        # Same container-vs-host networking fix as bap-web above.
        NEXT_PUBLIC_API_BASE_URL: http://bap-y-backend:8000
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8006
        NEXT_PUBLIC_BRAND_ID: y
    env_file: ./BAP/web/.env
    depends_on:
      - bap-y-backend
    ports:
      - "3010:3000"

  # --- Monitoring (Phase 4.4 follow-up) ---
  # Optional, like gateway-cache — a local Prometheus/Grafana pair scraping the four
  # apps' already-real /metrics endpoints. This was previously documented as blocked
  # on "real cloud infrastructure that doesn't exist yet" — it wasn't actually blocked,
  # it just hadn't been built. `docker compose --profile with-monitoring up -d`.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["with-monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["with-monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "admin"  # pragma: allowlist secret — local dev only, never exposed
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
  # Signing/encryption key persistence (Phase 3 Exit fix, livetracker2.md 2026-07-24)
  # — see the `registry`/`beckn-gateway`/`bap-backend`/`bpp-backend` service comments
  # above for why. Local named volumes only, matching the existing *-db-data pattern;
  # a real deployment still needs an actual secrets manager (SECURITY.md's own
  # documented `[ENT]` HSM/KMS item) — this only fixes the dev/CI container-recreate
  # data-loss problem, not production key custody.
  registry-secrets:
  gateway-secrets:
  gateway-state:
  bap-secrets:
  bpp-secrets:
  # livetracker7.md Phase 2: same key-persistence pattern, one volume per new
  # participant's own signing/encryption identity (§2.1) — never shared with an
  # existing instance's keys.
  bpp-medical-secrets:
  bpp-automotive-secrets:
  bap-y-secrets:
