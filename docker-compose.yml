# Local/dev full-stack orchestration — 4 apps + 3 Postgres DBs + Redis.
# See README.md for setup steps and ARCHITECTURE.md for the system overview.
# STATUS: scaffolded ahead of Phase 1 application code — see README.md "Status note".
# services will not report healthy until Phase 1 lands each app's /health endpoint.

services:
  # --- Databases ---
  registry-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry  # pragma: allowlist secret
      POSTGRES_DB: registry
    volumes:
      - registry-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry"]
      interval: 10s
      timeout: 5s
      retries: 5

  bap-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bap
      POSTGRES_PASSWORD: bap  # pragma: allowlist secret
      POSTGRES_DB: bap
    volumes:
      - bap-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bap"]
      interval: 10s
      timeout: 5s
      retries: 5

  bpp-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bpp
      POSTGRES_PASSWORD: bpp  # pragma: allowlist secret
      POSTGRES_DB: bpp
    volumes:
      - bpp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Cache ---
  bap-cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bpp-cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-cache:
    image: redis:7-alpine
    # livetracker2.md §3.11: promoted from the optional with-gateway-cache profile to an
    # always-on service — no longer gated behind CACHE_ENABLED's old opt-in default. `search`
    # (§3.1) now puts Gateway on continuous, customer-facing traffic just like BAP/BPP, so its
    # circuit breaker (livetracker1.md Phase 4.2's RedisCircuitBreaker) needs to be on by
    # default too, matching BAP's/BPP's own unconditional Redis dependency instead of leaving
    # Gateway as the one inconsistent app. Backs the shared circuit-breaker state fix — without
    # it, Gateway's breaker falls back to in-memory, per-worker state and won't fail fast across
    # gunicorn's workers during a Registry outage (confirmed live in Phase 4.2 and re-confirmed
    # in §3.11 with the new default).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Applications ---
  # registry, beckn-gateway, bap-backend, bpp-backend build from the repo root (context: .)
  # because each imports the shared/ monorepo folder (django_observability, contract_schemas)
  # as a sibling of its own project dir — see each Dockerfile's top comment for why.
  registry:
    build:
      context: .
      dockerfile: registry/Dockerfile
    env_file: ./registry/.env
    # Real gap found and fixed at Phase 3 Exit (livetracker2.md, 2026-07-24): this
    # path was never a persisted volume, so every container recreate silently wiped
    # Registry's own signing/encryption identity, and every dependent participant's
    # trust relationship with it — the exact "Using ephemeral Registry ... key pair"
    # warning seen repeatedly in this session's own live testing.
    volumes:
      - registry-secrets:/run/secrets
    depends_on:
      registry-db:
        condition: service_healthy
    ports:
      - "8000:8000"

  beckn-gateway:
    build:
      context: .
      dockerfile: beckn-gateway/Dockerfile
    env_file: ./beckn-gateway/.env
    # Same fix as registry above — Gateway's key wipe on recreate is the exact,
    # repeatedly-hit "re-run onboarding for all three" recovery procedure documented
    # in RUNBOOK.md; this volume is what actually closes that gap going forward.
    volumes:
      - gateway-secrets:/app/data/secrets
    depends_on:
      registry:
        condition: service_started
      gateway-cache:
        condition: service_healthy
    ports:
      - "8003:8000"

  bap-backend:
    build:
      context: .
      dockerfile: BAP/backend/Dockerfile
    env_file: ./BAP/backend/.env
    # Same fix as registry/beckn-gateway above.
    volumes:
      - bap-secrets:/app/data/secrets
    depends_on:
      bap-db:
        condition: service_healthy
      bap-cache:
        condition: service_healthy
      registry:
        condition: service_started
    ports:
      - "8001:8000"

  bap-web:
    build:
      context: ./BAP/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8001
    env_file: ./BAP/web/.env
    depends_on:
      - bap-backend
    ports:
      - "3000:3000"

  bpp-backend:
    build:
      context: .
      dockerfile: BPP/backend/Dockerfile
    env_file: ./BPP/backend/.env
    # Same fix as registry/beckn-gateway/bap-backend above.
    volumes:
      - bpp-secrets:/app/data/secrets
    depends_on:
      bpp-db:
        condition: service_healthy
      bpp-cache:
        condition: service_healthy
      registry:
        condition: service_started
    ports:
      - "8002:8000"

  # livetracker4.md §2.1 cutover (2026-08-02): BPP's audit-log/metrics/WebSocket-
  # broadcast consumers no longer run inline inside bpp-backend's own request path —
  # `run_event_worker` (a real, separate long-lived process, not a request-handling
  # server) is now the only thing that drives them, so it must run continuously
  # alongside bpp-backend, not just be invoked ad hoc. Same image/env/DB as
  # bpp-backend (shares the same Django app and settings), different command.
  bpp-worker:
    build:
      context: .
      dockerfile: BPP/backend/Dockerfile
    env_file: ./BPP/backend/.env
    command: ["python", "manage.py", "run_event_worker"]
    # This process never serves HTTP — bpp-backend's inherited Dockerfile HEALTHCHECK
    # (a GET against :8000/health) would otherwise report it permanently unhealthy.
    healthcheck:
      disable: true
    # No other service in this file sets a restart policy — that's a pre-existing,
    # separate gap out of this section's own scope. This one matters more here
    # specifically: audit logging, business metrics, and WebSocket broadcasts now
    # depend entirely on this one process staying alive (livetracker4.md §2.1's
    # own gap audit), with nothing else covering for it if it dies. `unless-
    # stopped` restarts on crash/host-reboot but not after a deliberate `docker
    # compose stop`.
    restart: unless-stopped
    depends_on:
      bpp-db:
        condition: service_healthy
      bpp-cache:
        condition: service_healthy

  bpp-web:
    build:
      context: ./BPP/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8002
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8002
    env_file: ./BPP/web/.env
    depends_on:
      - bpp-backend
    ports:
      - "3001:3000"

  # --- Monitoring (Phase 4.4 follow-up) ---
  # Optional, like gateway-cache — a local Prometheus/Grafana pair scraping the four
  # apps' already-real /metrics endpoints. This was previously documented as blocked
  # on "real cloud infrastructure that doesn't exist yet" — it wasn't actually blocked,
  # it just hadn't been built. `docker compose --profile with-monitoring up -d`.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["with-monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["with-monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "admin"  # pragma: allowlist secret — local dev only, never exposed
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

volumes:
  registry-db-data:
  bap-db-data:
  bpp-db-data:
  prometheus-data:
  grafana-data:
  # Signing/encryption key persistence (Phase 3 Exit fix, livetracker2.md 2026-07-24)
  # — see the `registry`/`beckn-gateway`/`bap-backend`/`bpp-backend` service comments
  # above for why. Local named volumes only, matching the existing *-db-data pattern;
  # a real deployment still needs an actual secrets manager (SECURITY.md's own
  # documented `[ENT]` HSM/KMS item) — this only fixes the dev/CI container-recreate
  # data-loss problem, not production key custody.
  registry-secrets:
  gateway-secrets:
  bap-secrets:
  bpp-secrets:
